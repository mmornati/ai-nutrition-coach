# Dependabot version updates (B6). Pull requests only propose bumps; every one
# still goes through the full CI gate and the named-reviewer sign-off.
version: 2
updates:
  # JavaScript workspace: one pnpm lockfile at the root covers apps/web and
  # packages/core, so one entry and one grouped PR cover all of it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  # The browser-smoke harness (tools/webkit_smoke) has its own package-lock.json
  # and runs inside the pinned Playwright image.
  - package-ecosystem: npm
    directory: /tools/webkit_smoke
    schedule:
      interval: weekly
    groups:
      webkit-smoke:
        patterns: ['*']

  # Actions are pinned by commit SHA (with a version comment); Dependabot
  # keeps both in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Container base images are pinned by digest (node build stage, nginx-unprivileged
  # serve stage). Version bumps and digest refreshes arrive as one grouped PR;
  # the self-host smoke test and the browser smoke prove the new image before merge.
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ['*']
