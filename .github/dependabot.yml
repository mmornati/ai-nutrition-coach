# Dependabot version updates (B6). Pull requests only propose bumps; every one
# still goes through the full CI gate and the named-reviewer sign-off.
version: 2
updates:
  # JavaScript workspace: one pnpm lockfile at the root covers apps/web and
  # packages/core, so one entry and one grouped PR cover all of it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Supply chain: never propose a release younger than a week.
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint 8.x supports TypeScript <6.1; lift once it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']

  # The browser-smoke harness (tools/webkit_smoke) has its own package-lock.json
  # and runs inside the pinned Playwright image.
  - package-ecosystem: npm
    directory: /tools/webkit_smoke
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      webkit-smoke:
        patterns: ['*']

  # Actions are pinned by commit SHA (with a version comment); Dependabot
  # keeps both in step, in the workflows and in the local composite actions.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # Container base images are pinned by digest (node build stage, nginx-unprivileged
  # serve stage). Version bumps and digest refreshes arrive as one grouped PR;
  # ci.yml's self-host smoke and browser smoke prove the new image before merge. infra/Dockerfile.relay (the
  # opt-in encrypted-backup relay) carries the same node pin; tools/pwa/infra.test.mjs fails if the two drift.
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The build stage follows the project's Node line (24: package.json engines, CI,
      # CONTRIBUTING.md, tools/pwa/infra.test.mjs); a Node major is a deliberate change.
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        patterns: ['*']
