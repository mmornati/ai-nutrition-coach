# AI Nutrition Coach CI — reproducible build gate (NFR9).
#
# Runs on every pull request and push to main. Jobs:
#   verify  — format check, static analysis (`melos run analyze`), the full
#             test suite (`melos run test`), then the two compile gates:
#             `flutter build web --release` and `flutter build apk --debug`
#             (debug: a release build needs apps/client/android/key.properties,
#             which CI deliberately does not have; see docs/release-checklist.md).
#   docker  — `docker build -f infra/Dockerfile .` proves the self-host image
#             actually builds (it is built from the committed pubspec.lock),
#             then trivy scans it (HIGH/CRITICAL, unfixed ignored, B6).
#
# Secret scanning of the git history lives in gitleaks.yml (push, PR, weekly
# schedule and manual dispatch).
#
# Build output is scanned for key-shaped strings after the web and APK builds
# (tools/check_no_secrets_in_build.sh): anything compiled in is public (S1).
#
# Analyze + test are what the autonomous loop must pass before a story may be
# marked committed (see _bmad-output/implementation-artifacts/loop-status.yaml).
#
# Toolchain: Flutter 3.44.0 pinned by version AND digest. Keep in sync with
# scripts/flutter_docker.sh, infra/Dockerfile and CONTRIBUTING.md.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs on the same ref — keeps PR feedback loops fast
# without burning runner minutes on superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs that need more must escalate at job level.
permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test, build web + apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Read-only token is enough for checkout + the container's tooling.
    permissions:
      contents: read

    container:
      image: ghcr.io/cirruslabs/flutter:3.44.0@sha256:46691e311715845de03a3ba4753a475476936805b29431b1f00f1816981033f8
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print toolchain
        run: |
          flutter --version
          dart --version

      - name: Activate melos
        run: flutter pub global activate melos 8.2.2

      - name: Add melos to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Enforce the committed lockfile
        # A drifting pubspec.lock must fail CI, not be silently rewritten.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- pubspec.lock

      - name: Format check
        run: melos run format:check

      - name: Static analysis (AD-1 + per-package lints)
        run: melos run analyze

      - name: Tests (domain_core, integrations, client)
        run: melos run test

      - name: Tests under a DST zone (TZ=Europe/Paris)
        run: melos run test:dst

      - name: Build web (release)
        run: |
          bash scripts/fetch_web_sqlite.sh
          bash scripts/fetch_web_zxing.sh
          (cd apps/client && flutter build web --release --pwa-strategy=none --no-web-resources-cdn --dart-define=OPENPLATE_BUILD=selfhost)
          # OpenPlate's own service worker + precache manifest (ADR-0003).
          dart run tools/generate_precache_manifest.dart apps/client/build/web

      - name: Secrets scan — web bundle (S1)
        run: |
          bash tools/check_no_secrets_in_build.sh --self-test
          bash tools/check_no_secrets_in_build.sh --web-only

      - name: Third-party host scan — web bundle (N5)
        run: |
          bash tools/check_no_external_hosts.sh --self-test
          bash tools/check_no_external_hosts.sh

      - name: Telemetry gate (import-based, N6)
        run: dart run tools/check_telemetry_claims.dart

      - name: Build Android APK (debug)
        # flutter_secure_storage 11 compiles against android-37, which the
        # pinned image does not ship — install it (Phase 6 revisits the pin).
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0"
          cd apps/client
          flutter build apk --debug

      - name: Secrets scan — web bundle + APK (S1)
        run: bash tools/check_no_secrets_in_build.sh

  docker:
    name: Self-host image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build infra/Dockerfile
        run: docker build -f infra/Dockerfile -t openplate:ci .

      - name: Vulnerability scan (trivy) - fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openplate:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
