# AI Nutrition Coach CI — the single PR / main / tag gate (NFR9).
#
# One job, Dart SDK only (no Flutter): GitHub bills every job rounded up to
# the minute, and this one finishes in well under a minute. It replaces the
# former `ci`, `release-gate` and `ndp-review` workflows, which each
# installed Flutter (~1 min) and bootstrapped the workspace, and ran the same
# analyze + test suite twice.
#
# What it checks:
#   1. NDP review (Story 5.3 / FR-15): REVIEWERS.md + CODEOWNERS name the
#      reviewer.
#   2. Release posture gates C + D (Stories 4.5 / 4.6 / 5.1 / 5.2): the
#      `tools/check_*.dart` scripts. They only import `dart:io`, so they run
#      with plain `dart` — no `pub get`, no melos.
#   3. `packages/domain_core` (AD-1): format, analyze, test. It is pure Dart,
#      so it is resolved on its own (out of the pub workspace, whose other
#      members need the Flutter SDK).
#
# Deliberately NOT run: anything that needs Flutter (`apps/client`,
# `packages/integrations`, the web bundle). The Flutter client is being
# replaced by a PWA; its CI comes back with the migration. Until then run
# `melos run analyze` / `melos run test` locally when touching Flutter code.
# The self-host image smoke test is manual-only (self-host-smoke.yml).

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs on the same ref — no runner minutes on superseded
# commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gates + domain_core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: NDP review — REVIEWERS.md + CODEOWNERS name the reviewer
        run: |
          test -f REVIEWERS.md || { echo 'ndp-review: REVIEWERS.md missing — see Story 5.3 / FR-15.'; exit 1; }
          test -f .github/CODEOWNERS || { echo 'ndp-review: .github/CODEOWNERS missing — see Story 5.3 / FR-15.'; exit 1; }
          grep -q '@mmornati' REVIEWERS.md || { echo 'ndp-review: REVIEWERS.md missing the named-reviewer handle.'; exit 1; }
          grep -q '@mmornati' .github/CODEOWNERS || { echo 'ndp-review: CODEOWNERS missing the named-reviewer handle.'; exit 1; }

      # Same scripts as `melos run check:telemetry` / `check:release-posture`.
      - name: Gate D — check telemetry
        run: dart tools/check_telemetry_claims.dart

      - name: Gate C — check release posture
        run: |
          dart tools/check_release_posture.dart
          dart tools/check_adults_only.dart
          dart tools/check_no_under_13_profiles.dart
          dart tools/check_accessibility_floor.dart

      - name: domain_core — resolve outside the Flutter workspace
        working-directory: packages/domain_core
        run: |
          sed -i '/^resolution: workspace/d' pubspec.yaml
          dart pub get

      - name: domain_core — format check
        working-directory: packages/domain_core
        run: dart format --output=none --set-exit-if-changed .

      - name: domain_core — analyze
        working-directory: packages/domain_core
        run: dart analyze

      - name: domain_core — test (includes the AD-1 import gate)
        working-directory: packages/domain_core
        run: dart test
