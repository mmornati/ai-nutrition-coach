# AI Nutrition Coach CI — reproducible build gate (NFR9).
#
# Runs on every pull request and push to main. Jobs:
#   verify  — `pnpm verify`: format check, lint (warnings are errors), typecheck, unit tests
#             (including the service-worker generator/worker tests and the self-tests of the
#             gates), the suites re-run under TZ=Europe/Paris, the release-posture / telemetry /
#             log-hygiene / adults-only / accessibility-floor gates, the scanner self-tests, the
#             release build (+ precache manifest and sw.js), then the secrets scan and the
#             third-party host scan of the built bundle.
#   e2e     — the Playwright suite against the built preview in Chromium AND WebKit (offline
#             reload, update flow, barcode with a fake camera).
#   docker  — `docker build -f infra/Dockerfile .` proves the self-host image builds from the
#             committed lockfile, then trivy scans it (HIGH/CRITICAL, unfixed ignored, B6).
#
# Secret scanning of the git history lives in gitleaks.yml. The production image is exercised
# by self-host-smoke.yml (container hardening) and browser-smoke.yml (WebKit + Chromium).
#
# Toolchain: Node 24 and pnpm 11.14.0 (the root package.json `packageManager`, activated through
# corepack). Keep in sync with infra/Dockerfile, CONTRIBUTING.md and the other workflows.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs on the same ref — keeps PR feedback loops fast
# without burning runner minutes on superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs that need more must escalate at job level.
permissions:
  contents: read

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Activate pnpm 11.14.0 (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.14.0 --activate

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        # A drifting pnpm-lock.yaml must fail CI, not be silently rewritten.
        run: pnpm install --frozen-lockfile

      - name: Verify (format, lint, types, tests, DST, gates, build, bundle scans)
        run: pnpm verify

      - name: Release bundle has a service worker and a precache manifest
        run: test -f apps/web/dist/sw.js && test -f apps/web/dist/precache-manifest.json

  e2e:
    name: End-to-end (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Activate pnpm 11.14.0 (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.14.0 --activate

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (the pinned 1.63 Chromium and WebKit)
        run: pnpm --filter @anc/web exec playwright install --with-deps chromium webkit

      - name: End-to-end tests (built preview; offline reload and update flow)
        run: pnpm e2e
        env:
          PW_WEBKIT: '1'

  docker:
    name: Self-host image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build infra/Dockerfile
        run: docker build -f infra/Dockerfile -t ai-nutrition-coach:ci .

      - name: Vulnerability scan (trivy) - fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-nutrition-coach:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
