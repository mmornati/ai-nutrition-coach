# AI Nutrition Coach CI — reproducible build gate (NFR9).
#
# Every job calls a scripts/ci/ entry point, the same ones .circleci/config.yml
# runs, so both providers check exactly the same things (docs/ci-migration.md).
#
# Runs on every pull request, push to main and v* tag. Jobs:
#   verify  — scripts/ci/verify.sh: the named-reviewer check (REVIEWERS.md ↔ CODEOWNERS),
#             `pnpm verify` (format, lint, types, unit tests, the TZ=Europe/Paris re-run, the
#             release-posture / telemetry / log-hygiene / adults-only / accessibility gates, the
#             scanner self-tests, the release build, the bundle scans and guards), the release
#             bundle's service worker, and on v* tags the project-URL rule.
#   e2e     — scripts/ci/e2e.sh: Playwright in Chromium AND WebKit, inside the official
#             Playwright image (browsers and their OS dependencies preinstalled).
#   image   — scripts/ci/image.sh: builds infra/Dockerfile ONCE, scans it with trivy
#             (HIGH/CRITICAL, unfixed ignored, B6), runs the self-host smoke (container
#             hardening, no egress) and the WebKit + Chromium browser smoke against it.
#
# The SBOM (release tags) is in release-gate.yml; the git-history secret scan in gitleaks.yml.
#
# Toolchain: Node 24 and pnpm 11.14.0 (the root package.json `packageManager`, activated through
# corepack by scripts/ci/pnpm.sh). Keep in sync with infra/Dockerfile and CONTRIBUTING.md.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Cancel in-progress runs on the same ref — keeps PR feedback loops fast
# without burning runner minutes on superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs that need more must escalate at job level.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Verify
        env:
          CI_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          AI_NUTRITION_COACH_PROJECT_URL: ${{ vars.AI_NUTRITION_COACH_PROJECT_URL }}
        run: bash scripts/ci/verify.sh

  e2e:
    name: e2e (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep in step with @playwright/test in apps/web/package.json and
      # PLAYWRIGHT_IMAGE in scripts/webkit_smoke.sh.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-playwright-
      - name: End-to-end tests
        run: bash scripts/ci/e2e.sh
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  image:
    name: image (build, trivy, self-host smoke, browser smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image gates
        run: bash scripts/ci/image.sh
