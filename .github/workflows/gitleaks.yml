# Secret scan of the FULL git history (S1 / B6).
#
# Runs the gitleaks CLI (pinned image: version tag AND digest) over every
# commit, on every push and pull request, weekly (a new gitleaks ruleset can
# flag old commits), and on demand. The CLI is used rather than the
# gitleaks-action because the action scans only the PR's commits on
# pull_request events and needs a license for organisation repositories.
#
# Findings are redacted in the log. Actions are pinned by SHA and the image by
# digest; Dependabot (.github/dependabot.yml) proposes bumps.

# Provider switch (docs/ci-migration.md): while the repository variable CI_PROVIDER is
# `circleci`, every job here is skipped (no runner is requested, no minutes are used) unless the
# run is started by hand (workflow_dispatch).

name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (full history)
    if: vars.CI_PROVIDER != 'circleci' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks detect (all commits)
        run: bash scripts/ci/gitleaks.sh
