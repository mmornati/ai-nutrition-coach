# NDP-review CI workflow (FR-15 / NFR-3 / AD-7).
#
# Runs the named-reviewer gate on every PR + every tag:
#   * Asserts REVIEWERS.md exists at HEAD and records the named
#     reviewer.
#   * Asserts .github/CODEOWNERS exists at HEAD and pins the
#     right paths.
#   * Runs the posture gates with node (release posture, adults-only,
#     telemetry, log hygiene, accessibility floor).
#
# A regression on any check fails the build. The named reviewer
# signs off every PR that touches user-facing copy.

name: ndp-review

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Least privilege: jobs that need more must escalate at job level.
permissions:
  contents: read

jobs:
  ndp-review:
    name: ndp-review
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert REVIEWERS.md + CODEOWNERS are at HEAD
        run: |
          test -f REVIEWERS.md || (echo 'ndp-review: REVIEWERS.md missing — see Story 5.3 / FR-15.' && exit 1)
          test -f .github/CODEOWNERS || (echo 'ndp-review: .github/CODEOWNERS missing — see Story 5.3 / FR-15.' && exit 1)
          # Generic: whatever owner handles CODEOWNERS names must also be
          # recorded in REVIEWERS.md. Forking the repo and replacing the
          # placeholder handle needs no change to this gate.
          # (An owner is a whitespace-delimited @handle; e-mail owners such as
          # a@b.example are not matched.)
          owners=$(grep -v '^[[:space:]]*#' .github/CODEOWNERS | grep -oE '(^|[[:space:]])@[A-Za-z0-9_./-]+' | sed -E 's/^[[:space:]]+//' | sort -u)
          test -n "$owners" || (echo 'ndp-review: CODEOWNERS names no owner.' && exit 1)
          for o in $owners; do
            esc=$(printf '%s' "$o" | sed 's/[.[\*^$/]/\\&/g')
            grep -qE "(^|[^A-Za-z0-9_./@-])${esc}([^A-Za-z0-9_./-]|$)" REVIEWERS.md || (echo "ndp-review: CODEOWNERS owner $o is not recorded in REVIEWERS.md." && exit 1)
          done
          echo 'ndp-review: REVIEWERS.md + CODEOWNERS at HEAD.'

      - name: Activate pnpm 11.14.0 (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.14.0 --activate

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        # The gates parse the sources with the repo's pinned TypeScript.
        run: pnpm install --frozen-lockfile

      - name: Run the posture gates (release posture, telemetry, log hygiene, adults-only, accessibility floor)
        run: pnpm gates

      - name: Gate summary
        if: success()
        run: 'echo "ndp-review: PASS"'
