# Publish the self-host image to the GitHub Container Registry:
# ghcr.io/mmornati/ai-nutrition-coach (linux/amd64), for servers that pull instead of building
# (docs/self-host.md "Run the published image instead of building").
#
# The image is host-independent: every setting is read by the container at start (the
# service-worker build id is computed there too), so one image serves every instance.
#
# Tags:
#   push to main           -> :edge, :sha-<7>     (the head of main, never :latest)
#   release tag vX.Y.Z     -> :X.Y.Z, :X.Y, :sha-<7>, and :latest only when it is the highest
#                             stable release (a fix on an older line never moves :latest back)
#   pre-release vX.Y.Z-rc.N -> :X.Y.Z-rc.N, :sha-<7>  (never :latest nor :X.Y)
#   manual run             -> :branch-<slug>, :sha-<7>  (Actions -> publish -> Run workflow, to
#                             try a branch on the server before merging)
#
# Nothing is pushed unless the image passed its checks first:
#   test-image     builds the image exactly as published (same Dockerfile, build arguments and
#                  cache), scans it with trivy (fixable HIGH/CRITICAL fail, like ci.yml) and drives
#                  it in WebKit and Chromium (scripts/webkit_smoke.sh, like browser-smoke.yml);
#   release-gates  (release tags only) the release posture, telemetry and project-URL gates, like
#                  release-gate.yml;
#   publish        rebuilds from the cache test-image filled (same layers) and pushes, with OCI
#                  labels (revision = the commit built), a provenance attestation and an SBOM.
#
# The canonical repository only: a fork has nothing to push under ghcr.io/mmornati.

name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Two merges close together on main: only the last one matters for :edge. A release or a manual
# run is never cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

# Least privilege: jobs that need more must escalate at job level.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/mmornati/ai-nutrition-coach
  TEST_IMAGE: ai-nutrition-coach:publish-test

jobs:
  test-image:
    name: Build, scan and smoke the image
    if: github.repository == 'mmornati/ai-nutrition-coach'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # linux/amd64 only: no QEMU.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the release image (loaded locally, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: ${{ env.TEST_IMAGE }}
          # A release build: the project-URL rule runs inside the build. An empty URL keeps the
          # default (the repository page); a fork may set the repository VARIABLE
          # AI_NUTRITION_COACH_PROJECT_URL (see release-gate.yml).
          build-args: |
            AI_NUTRITION_COACH_RELEASE=1
            AI_NUTRITION_COACH_PROJECT_URL=${{ vars.AI_NUTRITION_COACH_PROJECT_URL || '' }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max

      - name: Vulnerability scan (trivy) - fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: WebKit + Chromium smoke of this image
        env:
          AI_NUTRITION_COACH_SMOKE_IMAGE: ${{ env.TEST_IMAGE }}
        run: bash scripts/webkit_smoke.sh --no-build

  release-gates:
    name: Release gates (tags)
    if: github.repository == 'mmornati/ai-nutrition-coach' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Activate pnpm 11.14.0 (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.14.0 --activate

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Gate C — release posture
        run: pnpm check:release-posture

      - name: Gate D — telemetry
        run: pnpm check:telemetry

      - name: Gate C — project URL
        env:
          AI_NUTRITION_COACH_BUILD: release
          AI_NUTRITION_COACH_PROJECT_URL: ${{ vars.AI_NUTRITION_COACH_PROJECT_URL }}
        run: node tools/check_project_url.mjs

  publish:
    name: Publish to ghcr.io
    needs: [test-image, release-gates]
    # release-gates is skipped off tags; anything else than success / skipped stops the push.
    if: >-
      !cancelled() && github.repository == 'mmornati/ai-nutrition-coach'
      && needs.test-image.result == 'success'
      && (needs.release-gates.result == 'success' || needs.release-gates.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # every tag, to know whether this release is the highest

      - name: Compute the tags
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          tags=("$IMAGE:sha-${sha:0:7}")
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            if ! [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::\"$tag\" is not a SemVer release tag (vX.Y.Z or vX.Y.Z-suffix)"
              exit 1
            fi
            version="${tag#v}"
            tags+=("$IMAGE:$version")
            if [ -z "${BASH_REMATCH[4]}" ]; then
              tags+=("$IMAGE:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
              highest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
              if [ "$highest" = "$tag" ]; then
                tags+=("$IMAGE:latest")
              else
                echo "::notice::$tag is not the highest release ($highest): :latest unchanged"
              fi
            fi
          elif [ "$REF_NAME" = main ]; then
            version="edge"
            tags+=("$IMAGE:edge")
          else
            # Branch name -> a valid Docker tag ([a-z0-9._-], 128 characters at most).
            slug="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-' | cut -c1-100)"
            version="branch-$slug"
            tags+=("$IMAGE:branch-$slug")
          fi

          {
            echo "revision=$sha"
            echo "version=$version"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf 'Tags: %s\n' "${tags[*]}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (from the tested cache) and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          # The same pull as test-image, so both resolve the base images alike and the layers
          # come from the cache it filled.
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            AI_NUTRITION_COACH_RELEASE=1
            AI_NUTRITION_COACH_PROJECT_URL=${{ vars.AI_NUTRITION_COACH_PROJECT_URL || '' }}
          labels: |
            org.opencontainers.image.title=AI Nutrition Coach
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          # Provenance and SBOM attached: what is in the image can be checked.
          provenance: true
          sbom: true
          cache-from: type=gha,scope=publish

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.meta.outputs.revision }}
        run: |
          {
            echo "### Image published"
            echo
            echo "Revision \`${REVISION:0:7}\`, digest \`$DIGEST\`"
            echo
            while read -r tag; do
              [ -z "$tag" ] || echo "- \`$tag\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
