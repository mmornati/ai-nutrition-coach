# Release SBOM (B6): an SPDX SBOM of the RELEASE self-host image, uploaded as a
# workflow artifact. Release tags and manual runs only.
#
# The release gates themselves (verify, posture, telemetry, named reviewer, and on
# v* tags the project-URL rule) run in ci.yml, which also triggers on v* tags, so
# they are not repeated here. The durable artefact of the named-reviewer sign-off
# is the release checklist (docs/release-checklist.md).
#
# The project URL defaults to the repository page. A fork may set the repository
# VARIABLE AI_NUTRITION_COACH_PROJECT_URL to override it; the build FAILS if the
# override is empty-hosted or `.invalid`.

name: release-gate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM (self-host image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the release image and its SBOM
        env:
          AI_NUTRITION_COACH_PROJECT_URL: ${{ vars.AI_NUTRITION_COACH_PROJECT_URL }}
        run: bash scripts/ci/sbom.sh
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-nutrition-coach-image-sbom
          path: ai-nutrition-coach-image.spdx.json
          if-no-files-found: error
