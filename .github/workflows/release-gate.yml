# Release-gate CI workflow (FR-12 / FR-15).
#
# Runs the release-posture gates on every PR + every tag:
#   * `pnpm verify`                 — Gate A (format, lint, types, tests, DST, gates, build, scans).
#   * `pnpm check:release-posture`  — Gate C, run on its own so a failure is named.
#   * `pnpm check:telemetry`        — Gate D, likewise.
#   * the project-URL rule with a RELEASE build flavour (release tags only).
#   * an SPDX SBOM of the self-host image, uploaded as a workflow artifact (B6).
#
# A regression on any gate fails the build. The named-reviewer sign-off is recorded in the PR
# thread; the durable artefact is the release checklist (`docs/release-checklist.md`).

name: release-gate

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Least privilege: jobs that need more must escalate at job level.
permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Activate pnpm 11.14.0 (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.14.0 --activate

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Gate A — verify
        run: pnpm verify

      - name: Gate C — release posture
        run: pnpm check:release-posture

      - name: Gate D — telemetry
        run: pnpm check:telemetry

      - name: Gate C - project URL (release tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AI_NUTRITION_COACH_BUILD: release
          AI_NUTRITION_COACH_PROJECT_URL: ${{ vars.AI_NUTRITION_COACH_PROJECT_URL }}
        run: node tools/check_project_url.mjs

      - name: Gate summary
        if: success()
        run: 'echo "release-gate: PASS"'

  sbom:
    name: SBOM (self-host image)
    # Release tags and manual runs only; never on pull requests.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build infra/Dockerfile
        # A release image: the project-URL rule is enforced inside the build.
        # The project URL defaults to the repository page. A fork may set the
        # repository VARIABLE AI_NUTRITION_COACH_PROJECT_URL (Settings ->
        # Secrets and variables -> Actions -> Variables) to override it; the
        # build FAILS if the override is empty-hosted or `.invalid`.
        run: >
          docker build -f infra/Dockerfile -t ai-nutrition-coach:release
          --build-arg AI_NUTRITION_COACH_RELEASE=1
          --build-arg "AI_NUTRITION_COACH_PROJECT_URL=${{ vars.AI_NUTRITION_COACH_PROJECT_URL }}" .

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ai-nutrition-coach:release
          format: spdx-json
          output-file: ai-nutrition-coach-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-nutrition-coach-image-sbom
          path: ai-nutrition-coach-image.spdx.json
          if-no-files-found: error
