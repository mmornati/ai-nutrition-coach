# Story 4.6 — release-gate CI workflow (FR-12 / FR-15).
#
# Runs the four release-posture gates on every PR + every tag:
#   * `melos run analyze`           — Gate A.
#   * `melos run test`              — Gate A.
#   * `melos run smoke:self-host`   — Gate B.
#   * `melos run check:telemetry`   — Gate D.
#   * `melos run check:release-posture` — Gate C.
#   * an SBOM of the self-host image, uploaded as a workflow artifact (B6).
#
# A regression on any gate fails the build. The named-reviewer
# sign-off is recorded in the PR thread; the durable artefact is
# the release checklist (`docs/release-checklist.md`).

name: release-gate

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Least privilege: jobs that need more must escalate at job level.
permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Install melos
        run: dart pub global activate melos 8.2.2

      - name: Bootstrap the workspace
        run: melos bootstrap

      - name: Gate A — analyze
        run: melos run analyze

      - name: Gate A — test
        run: melos run test

      - name: Gate A — test (DST zone)
        run: melos run test:dst

      - name: Gate D — check telemetry
        run: melos run check:telemetry

      - name: Gate C — check release posture
        run: melos run check:release-posture

      - name: Gate C - project URL (release tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AI_NUTRITION_COACH_BUILD: release
          AI_NUTRITION_COACH_PROJECT_URL: ${{ vars.AI_NUTRITION_COACH_PROJECT_URL }}
        run: dart run tools/check_release_posture.dart --project-url-only

      - name: Gate summary
        if: success()
        run: 'echo "release-gate: PASS"'

  sbom:
    name: SBOM (self-host image)
    # Release tags and manual runs only; never on pull requests.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build infra/Dockerfile
        # A release image: the project-URL rule is enforced inside the build.
        # The project URL defaults to the repository page. A fork may set the
        # repository VARIABLE AI_NUTRITION_COACH_PROJECT_URL (Settings ->
        # Secrets and variables -> Actions -> Variables) to override it; the
        # build FAILS if the override is empty-hosted or `.invalid`.
        run: >
          docker build -f infra/Dockerfile -t ai-nutrition-coach:release
          --build-arg AI_NUTRITION_COACH_RELEASE=1
          --build-arg "AI_NUTRITION_COACH_PROJECT_URL=${{ vars.AI_NUTRITION_COACH_PROJECT_URL }}" .

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ai-nutrition-coach:release
          format: spdx-json
          output-file: ai-nutrition-coach-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-nutrition-coach-image-sbom
          path: ai-nutrition-coach-image.spdx.json
          if-no-files-found: error
