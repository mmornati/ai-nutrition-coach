# Story 4.4 — self-host CI smoke test (FR-11 / NFR9).
#
# Runs the `bin/ai-nutrition-coach up` flow end-to-end on every PR. The smoke
# test asserts:
#   * The image builds in under 5 minutes (NFR9 / FR-11).
#   * `curl http://localhost/` returns 200 + the lock-screen HTML.
#   * The `nginx:alpine` base is digest-pinned (NFR9).
#   * The container's network namespace is quiet (FR-12 / NFR4).
#
# The job runs on a standard GitHub-hosted runner so the budget is
# comparable to a self-hoster's first-time experience on commodity
# hardware.

name: self-host-smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    name: bin/ai-nutrition-coach up + curl healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Run the self-host smoke test
        run: bash scripts/smoke_self_host.sh

      - name: Smoke summary
        if: success()
        run: |
          echo "self-host smoke: PASS"
