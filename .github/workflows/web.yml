# React PWA (apps/web + packages/core) gate: format, lint, typecheck, unit tests (incl. the
# service-worker generator and worker tests), build (+ precache manifest and sw.js), e2e in
# Chromium AND WebKit (offline reload, update flow), third-party host scan and secrets scan of the
# built bundle. The production image is built and smoked by self-host-smoke.yml and
# browser-smoke.yml.
name: web

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Install Playwright browser
        run: pnpm --filter @anc/web exec playwright install --with-deps chromium webkit
      - name: End-to-end tests (built preview, Chromium + WebKit; offline reload and update flow)
        run: pnpm --filter @anc/web e2e
        env:
          PW_WEBKIT: '1'
      - name: Release bundle has a service worker and a precache manifest
        run: test -f apps/web/dist/sw.js && test -f apps/web/dist/precache-manifest.json
      - name: Third-party host scan
        run: bash tools/check_no_external_hosts.sh apps/web/dist
      - name: Secrets scan
        run: bash tools/check_no_secrets_in_build.sh apps/web/dist
