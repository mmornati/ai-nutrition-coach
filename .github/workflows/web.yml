# React PWA (apps/web + packages/core) gate: lint, typecheck, unit tests, build, e2e,
# third-party host scan and secrets scan of the built bundle.
name: web

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Install Playwright browser
        run: pnpm --filter @anc/web exec playwright install --with-deps chromium
      - name: End-to-end tests (built preview, incl. offline reload)
        run: pnpm --filter @anc/web e2e
      - name: Third-party host scan
        run: bash tools/check_no_external_hosts.sh apps/web/dist
      - name: Secrets scan
        run: bash tools/check_no_secrets_in_build.sh apps/web/dist
