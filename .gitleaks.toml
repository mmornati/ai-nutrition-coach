# gitleaks configuration — extends the default ruleset and allow-lists the
# known non-secrets that trip `generic-api-key`:
#
#   * test fixtures shaped like provider keys (`sk-test-…`, `sk-keyforA-…`,
#     `sk-or-v1-SECRETMATERIAL-…`) — deliberately key-shaped so the redaction
#     and "key never leaks" tests exercise the real code paths;
#   * the secure-storage alias *names* (`ai_nutrition_coach_db_key_v1`,
#     `openplate_byok_key_v1`, …) — identifiers, not values.
#
# Keep this list narrow: match the exact fixture shapes, never whole paths,
# so a real key committed into a test file is still caught.
# `tools/check_no_secrets_in_build.sh` separately scans build output.

[extend]
useDefault = true

[allowlist]
description = "Key-shaped test fixtures and secure-storage alias names"
regexTarget = "match"
regexes = [
  # Test fixtures (apps/client/test, packages/*/test).
  '''sk-test-[0-9a-f]{10,16}''',
  '''sk-test-[A-Za-z0-9]{8,16}''',
  '''sk-abc123456789''',
  '''sk-keyfor[A-Z]-[A-Za-z0-9]{8,16}''',
  '''sk-or-v1-SECRETMATERIAL-[0-9a-f]{4}''',
  '''sk-secret-must-not-leak''',
  # Secure-storage alias identifiers (lib code), current and legacy names.
  '''(ai_nutrition_coach|openplate)_(db_key|byok_key|rung_config|quota|settings|kv)[a-z0-9_]*_v[0-9]+''',
]
