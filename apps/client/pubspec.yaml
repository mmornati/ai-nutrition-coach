name: ai_nutrition_coach
description: "AI Nutrition Coach responsive client (iOS / Android / web)."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # AD-7: UI strings live in ARB files (lib/l10n/app_en.arb) compiled by
  # gen-l10n; dates and times are formatted per locale through intl.
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management — AD-3: Riverpod state is derived, never a second source.
  flutter_riverpod: 3.4.2

  # Hexagonal ports seam — UI never imports drift/dio/mobile_scanner directly (AD-1).
  domain_core:
    path: ../../packages/domain_core

  # AD-8 adapter wiring — drift store factory + secure key source.
  integrations:
    path: ../../packages/integrations

  # Story 1.7 / FR2 — barcode scanner surface. `mobile_scanner` is
  # the only camera dependency in the repo (no `qr_code_scanner` or
  # alt). `permission_handler` handles the cross-platform camera
  # permission prompt so the calm "Camera denied — type it instead"
  # fallback has a single seam (NFR7).
  mobile_scanner: ^7.4.0
  permission_handler: ^11.3.1

  # Story 1.8 / FR1 — photo capture surface. `image_picker` is the
  # single camera dependency for the photo path; the `photo_provider`
  # seam abstracts the picker so tests inject a fake without ever
  # mounting a real camera. `image_picker` lives ONLY here — neither
  # `packages/integrations` nor `packages/domain_core` may import it
  # (AD-1 grep test pins the rule).
  image_picker: ^1.2.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  melos: 8.2.2

flutter:
  uses-material-design: true
  generate: true

  # Font licence texts, registered with LicenseRegistry (state/font_licenses.dart).
  assets:
    - assets/fonts/LICENSE-Roboto.txt
    - assets/licenses/OFL-NotoSansSymbols.txt

  # N5 — Roboto is bundled so the web build never downloads its default font
  # from fonts.gstatic.com (Apache-2.0, see assets/fonts/LICENSE-Roboto.txt).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
