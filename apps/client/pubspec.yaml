name: openplate_client
description: "OpenPlate responsive client (iOS / Android / web)."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — AD-3: Riverpod state is derived, never a second source.
  flutter_riverpod: 3.4.2

  # Hexagonal ports seam — UI never imports drift/dio/mobile_scanner directly (AD-1).
  domain_core:
    path: ../packages/domain_core

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  melos: 8.2.2

flutter:
  uses-material-design: true
