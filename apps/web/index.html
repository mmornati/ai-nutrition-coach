<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI Nutrition Coach</title>
    <meta name="description" content="A quiet, offline-first plate-logging app." />
    <meta name="theme-color" content="#0E1A3A" />
    <!-- use-credentials: the browser fetches a manifest WITHOUT cookies by default, so behind a
         forward-auth SSO (docs/self-host.md "Behind Authentik") it would get the sign-in redirect and
         the app would not be installable. Same origin, so nothing else changes. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nutrition Coach" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link
      rel="preload"
      href="/fonts/barlowcond-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="/boot-guard.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
