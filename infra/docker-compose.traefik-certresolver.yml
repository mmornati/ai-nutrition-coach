# Overlay for docker-compose.traefik.yml: use a named ACME certificate resolver.
#
#   AI_NUTRITION_COACH_TRAEFIK_CERTRESOLVER=letsencrypt AI_NUTRITION_COACH_DOMAIN=plate.example.com \
#     docker compose -f infra/docker-compose.traefik.yml \
#                    -f infra/docker-compose.traefik-certresolver.yml up -d
#
# A separate file so that, when you do NOT use a resolver, no empty
# `tls.certresolver` label exists at all. `bin/ai-nutrition-coach up --traefik` adds
# this file automatically when AI_NUTRITION_COACH_TRAEFIK_CERTRESOLVER is set.

services:
  ai-nutrition-coach:
    labels:
      traefik.http.routers.ai-nutrition-coach.tls.certresolver: ${AI_NUTRITION_COACH_TRAEFIK_CERTRESOLVER:?set AI_NUTRITION_COACH_TRAEFIK_CERTRESOLVER to your resolver name}
