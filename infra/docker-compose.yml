# AI Nutrition Coach self-host stack.
#
#   docker compose -f infra/docker-compose.yml up -d                 # app on 127.0.0.1:8080
#   AI_NUTRITION_COACH_DOMAIN=plate.example.com \
#     docker compose -f infra/docker-compose.yml --profile tls up -d # + Caddy, automatic HTTPS
#
# (`bin/ai-nutrition-coach up --compose` / `bin/ai-nutrition-coach up --tls` wrap these.)
#
#   docker compose -f infra/docker-compose.yml --profile sync up -d  # + the encrypted-backup relay
#   (set AI_NUTRITION_COACH_SYNC=1 with it; `bin/ai-nutrition-coach up --sync` does both and builds
#   the relay image)
#
# The app container is a STATIC web server: it holds no user data and has no
# volume. Your data lives encrypted in your browser (OPFS); use the in-app
# export or encrypted backup. See docs/self-host.md. The OPT-IN `sync` profile adds a second container,
# the relay, which keeps an encrypted copy that only the person's passphrase can open, in SQLite on the
# named volume `sync-data` (back that volume up: it holds ciphertext only).
#
# Plain HTTP on anything but localhost is unsupported: the web store refuses to
# run without a secure context (https:// or localhost). Hence the default bind
# of 127.0.0.1 — to reach it from other devices, use the `tls` profile.
#
# Environment (all optional; set AI_NUTRITION_COACH_DOMAIN for a real tls deployment):
#   AI_NUTRITION_COACH_IMAGE_TAG          image to run (default ai-nutrition-coach:dev)
#   AI_NUTRITION_COACH_BIND               host interface for the app port (default 127.0.0.1)
#   AI_NUTRITION_COACH_PORT               host port for the app (default 8080)
#   AI_NUTRITION_COACH_CONNECT_SRC_EXTRA  extra CSP connect-src origins, e.g. the BYOK AI
#                                endpoint: "https://api.openai.com"
#   AI_PROXY_ENABLED / AI_PROXY_UPSTREAM / AI_PROXY_KEY / AI_PROXY_MODEL / AI_PROXY_LABEL
#   (and AI_PROXY_TRANSCRIPTION* for voice to text)
#                                one AI key for everyone on this instance (off by default; see
#                                infra/server.env.example and docs/self-host.md)
#   AI_NUTRITION_COACH_SYNC / AI_NUTRITION_COACH_RELAY_IMAGE_TAG / SYNC_SIGNUP / SYNC_INVITE_CODES /
#   SYNC_MAX_VAULT_MB / SYNC_MAX_VAULTS ...
#                                the encrypted-backup relay (profile `sync`; off by default; see
#                                docs/self-host.md "Encrypted backup on your own server")
#   AI_NUTRITION_COACH_DOMAIN             public DNS name for the tls profile (default
#                                `localhost`: a local, self-signed trial)
#   AI_NUTRITION_COACH_TLS_BIND           interface Caddy listens on (default 0.0.0.0)

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  ai-nutrition-coach:
    <<: *hardening
    image: ${AI_NUTRITION_COACH_IMAGE_TAG:-ai-nutrition-coach:dev}
    ports:
      - "${AI_NUTRITION_COACH_BIND:-127.0.0.1}:${AI_NUTRITION_COACH_PORT:-8080}:8080"
    environment:
      AI_NUTRITION_COACH_CONNECT_SRC_EXTRA: ${AI_NUTRITION_COACH_CONNECT_SRC_EXTRA:-}
      # 1 = serve the service-worker kill switch (docs/pwa.md); normally unset.
      AI_NUTRITION_COACH_SW_KILL: ${AI_NUTRITION_COACH_SW_KILL:-}
      # off (default) | on (minimal, address-truncated, no User-Agent) | full
      # (docs/self-host.md "Logs").
      AI_NUTRITION_COACH_ACCESS_LOG: ${AI_NUTRITION_COACH_ACCESS_LOG:-off}
      # Instance-wide AI (docs/self-host.md "Offer AI to everyone on your instance"). Off unless
      # AI_PROXY_ENABLED=1 and a key are set. The key is read by the container at start, rendered
      # into a private file under /tmp, and never reaches the browser, the image or the logs.
      AI_PROXY_ENABLED: ${AI_PROXY_ENABLED:-0}
      AI_PROXY_UPSTREAM: ${AI_PROXY_UPSTREAM:-}
      AI_PROXY_KEY: ${AI_PROXY_KEY:-}
      AI_PROXY_MODEL: ${AI_PROXY_MODEL:-}
      AI_PROXY_LABEL: ${AI_PROXY_LABEL:-}
      AI_PROXY_RATE: ${AI_PROXY_RATE:-10r/m}
      AI_PROXY_RATE_ALL: ${AI_PROXY_RATE_ALL:-30r/m}
      AI_PROXY_BURST: ${AI_PROXY_BURST:-5}
      AI_PROXY_CONN: ${AI_PROXY_CONN:-2}
      AI_PROXY_TOKEN_PARAM: ${AI_PROXY_TOKEN_PARAM:-max_tokens}
      AI_PROXY_MAX_TOKENS: ${AI_PROXY_MAX_TOKENS:-2000}
      # 1 keeps one prompt-cache marker (cache_control) per request; for providers that read it.
      AI_PROXY_CACHE_MARKERS: ${AI_PROXY_CACHE_MARKERS:-0}
      # Voice transcription (POST /ai/v1/audio/transcriptions): off unless AI_PROXY_TRANSCRIPTION=1.
      AI_PROXY_TRANSCRIPTION: ${AI_PROXY_TRANSCRIPTION:-0}
      AI_PROXY_TRANSCRIPTION_MODEL: ${AI_PROXY_TRANSCRIPTION_MODEL:-whisper-1}
      AI_PROXY_TRANSCRIPTION_RATE: ${AI_PROXY_TRANSCRIPTION_RATE:-6r/m}
      AI_PROXY_TRANSCRIPTION_RATE_ALL: ${AI_PROXY_TRANSCRIPTION_RATE_ALL:-20r/m}
      AI_PROXY_TRANSCRIPTION_BURST: ${AI_PROXY_TRANSCRIPTION_BURST:-2}
      # Encrypted-backup relay (profile `sync`): 1 proxies /sync/ to the `sync-relay` service below;
      # 0 (the default) makes /sync/ a plain 404 and the app shows nothing about sync.
      AI_NUTRITION_COACH_SYNC: ${AI_NUTRITION_COACH_SYNC:-0}
      SYNC_MAX_VAULT_MB: ${SYNC_MAX_VAULT_MB:-20}
    # nginx writes only to /tmp (pid, temp dirs, the config rendered at start).
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  # Opt-in HTTPS: Caddy obtains and renews a certificate for AI_NUTRITION_COACH_DOMAIN
  # automatically (Let's Encrypt; ports 80 + 443 must be reachable from the
  # internet for a public domain; use `localhost` for a local, self-signed
  # trial) and adds HSTS. It is the only service that publishes 80/443.
  caddy:
    <<: *hardening
    profiles: ["tls"]
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    depends_on:
      ai-nutrition-coach:
        condition: service_healthy
    ports:
      - "${AI_NUTRITION_COACH_TLS_BIND:-0.0.0.0}:80:80"
      - "${AI_NUTRITION_COACH_TLS_BIND:-0.0.0.0}:443:443"
    environment:
      AI_NUTRITION_COACH_DOMAIN: ${AI_NUTRITION_COACH_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificates + ACME account (keep this!)
      - caddy-config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    # Binding 80/443 as root-in-container needs only this one capability.
    cap_add: [NET_BIND_SERVICE]

  # Opt-in encrypted-backup relay (docs/encrypted-sync-plan.md §3.5). It stores ciphertext it cannot
  # read: the handle, a salt, a wrapped key, a keyed hash of a value derived from the passphrase and
  # the sealed snapshot. It publishes NO port: only the app container's nginx reaches it, on the
  # compose network. Same hardening as the app: read-only root, no capabilities, non-root, health
  # check. Writes only to /tmp (a tmpfs) and the data volume.
  sync-relay:
    <<: *hardening
    profiles: ["sync"]
    image: ${AI_NUTRITION_COACH_RELAY_IMAGE_TAG:-ai-nutrition-coach-relay:dev}
    environment:
      SYNC_IDENTITY: handle
      # open | invite | closed. `invite` needs SYNC_INVITE_CODES (comma-separated codes).
      SYNC_SIGNUP: ${SYNC_SIGNUP:-open}
      SYNC_INVITE_CODES: ${SYNC_INVITE_CODES:-}
      SYNC_MAX_VAULT_MB: ${SYNC_MAX_VAULT_MB:-20}
      SYNC_MAX_VAULTS: ${SYNC_MAX_VAULTS:-50}
      SYNC_MAX_DEVICES: ${SYNC_MAX_DEVICES:-20}
      SYNC_MAX_UPLOADS: ${SYNC_MAX_UPLOADS:-3}
      SYNC_RATE_IP: ${SYNC_RATE_IP:-30}
      SYNC_RATE_HANDLE: ${SYNC_RATE_HANDLE:-10}
      SYNC_RATE_HANDLE_DAY: ${SYNC_RATE_HANDLE_DAY:-20}
      SYNC_RATE_SIGNUP: ${SYNC_RATE_SIGNUP:-5}
      SYNC_RATE_WRITE: ${SYNC_RATE_WRITE:-60}
      # The only caller is the app container's nginx, which sets X-Real-IP: believe it.
      SYNC_TRUST_PROXY: "1"
    volumes:
      - sync-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

volumes:
  caddy-data:
  caddy-config:
  # The relay's SQLite file and its server secret: ciphertext, handles and keyed hashes only.
  sync-data:
