# ───────────────────────────────────────────────────────────────────────────
# OpenPlate SPA nginx config (FR11 seam).
#
# Three responsibilities:
#   1. Serve the release build straight out of /usr/share/nginx/html.
#   2. Fall back to /index.html for any path that does not match a static
#      file — required for client-side routing in a Flutter web app.
#   3. Gzip the Flutter web bundle's heavy assets (main.dart.js, .wasm,
#      .css, .json, .svg) and ship the minimum sensible security headers.
#
# The fallback is what makes the Day Board's deep-link URLs (e.g.
# /board/2026-08-13) work after a refresh.
# ───────────────────────────────────────────────────────────────────────────

# ── gzip ──────────────────────────────────────────────────────────────────
# Flutter web's release bundle is dominated by main.dart.js + .wasm; gzip
# brings both down by ~70% over the wire.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    application/javascript
    application/wasm
    application/json
    text/css
    text/plain
    image/svg+xml;

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Cache-bust hashed asset bundles aggressively; keep index.html fresh so
    # SPA navigations always pick up the latest shell.
    location ~* \.(?:js|css|wasm|woff2?|ttf|png|jpg|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # SPA fallback (FR11). Any unmatched path returns index.html so Flutter's
    # router can resolve it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Story 4.4 — raise the upload limit so a 5MB plate photo never
    # gets clipped. Flutter web's ImagePicker caps at ~10MB on the
    # browser side; the server side just needs to clear the
    # `client_max_body_size` nginx default of 1MB.
    client_max_body_size 12m;

    # Security headers — nginx:alpine ships without any. This is the minimum
    # sensible posture for a self-host static SPA.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "interest-cohort=()" always;
}
