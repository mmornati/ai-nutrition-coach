# OpenPlate — nginx main config for the unprivileged, read-only-rootfs image.
#
# Everything nginx must WRITE lives under /tmp (a tmpfs at run time): the pid
# file, the request temp dirs and the config rendered from /etc/nginx/templates
# by the image entrypoint's envsubst step (see infra/Dockerfile:
# NGINX_ENVSUBST_OUTPUT_DIR=/tmp). The root filesystem can therefore be
# mounted read-only. Runs as uid 101 (nginx), listens on 8080.

worker_processes  2;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No version in the Server header or on error pages (I5).
    server_tokens off;

    access_log  /dev/stdout;
    sendfile    on;
    keepalive_timeout  65;

    # Rendered at container start from infra/nginx/templates/.
    include /tmp/openplate.conf;
}
