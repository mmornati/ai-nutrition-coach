# AI Nutrition Coach — nginx main config for the unprivileged, read-only-rootfs image.
#
# Everything nginx must WRITE lives under /tmp (a tmpfs at run time): the pid
# file, the request temp dirs and the config rendered from /etc/nginx/templates
# by the image entrypoint's envsubst step (see infra/Dockerfile:
# NGINX_ENVSUBST_OUTPUT_DIR=/tmp). The root filesystem can therefore be
# mounted read-only. Runs as uid 101 (nginx), listens on 8080.

# Instance AI proxy (40-render-ai-proxy.sh): load_module for njs when it is on, a comment when off.
include /tmp/ai-nutrition-coach-ai-main.inc;

worker_processes  2;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No version in the Server header or on error pages (I5).
    server_tokens off;

    # PV9: rendered at container start by 10-render-access-log.sh from
    # AI_NUTRITION_COACH_ACCESS_LOG (off by default; `on` = no User-Agent, truncated
    # address). Nothing is written without that file, and nginx refuses to
    # start if it is missing.
    include /tmp/ai-nutrition-coach-access-log.inc;

    # Rate-limit zones and the njs import of the instance AI proxy (rendered at start; a comment
    # when the proxy is off).
    include /tmp/ai-nutrition-coach-ai-http.inc;
    # The connection-limit zone of the encrypted-backup relay (a comment when it is off).
    include /tmp/ai-nutrition-coach-sync-http.inc;
    sendfile    on;
    keepalive_timeout  65;

    # Rendered at container start from infra/nginx/templates/.
    include /tmp/ai-nutrition-coach.conf;
}
