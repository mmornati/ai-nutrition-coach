# OpenPlate melos configuration — kept for compatibility with melos 7.x.
# Melos 8.x reads scripts from the root pubspec.yaml's `melos:` block
# instead; the canonical scripts live there. This file is retained as
# reference documentation and as a fallback for any tool that still
# expects melos.yaml.
name: openplate

packages:
  - apps/*
  - packages/*

command:
  bootstrap:
    runPubGetInParallel: true

scripts:
  analyze:
    description: Run static analysis across every package in the workspace.
    run: melos exec -c 1 --order-dependents -- "if grep -q '^flutter:' pubspec.yaml; then flutter analyze; else dart analyze; fi"

  test:
    description: Run unit tests across every package in the workspace.
    run: melos exec -c 4 --order-dependents -- "if grep -q '^flutter:' pubspec.yaml; then flutter test; else dart test; fi"

  format:check:
    description: Verify every package is `dart format`-clean.
    run: melos exec -c 1 --order-dependents -- "dart format --set-exit-if-changed ."

  build:web:
    description: Build the responsive client as a release web bundle (self-host).
    run: cd apps/client && flutter build web --release --pwa-strategy=none --dart-define=OPENPLATE_BUILD=selfhost

  build:runner:
    description: Run drift codegen across the integrations package.
    run: melos exec -c 1 --order-dependents --dir-exists=lib/src/store -- "dart run build_runner build --delete-conflicting-outputs"
