include: package:lints/recommended.yaml

# Mirror the posture set in `packages/domain_core/analysis_options.yaml`:
# public surface stays small, no classes that are only static-member
# holders. The linter block is shared so both packages lint the same way.

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - .dart_tool/**

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    prefer_final_locals: true
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    # Private named parameters (`this._x`) are the only way to satisfy this
    # for the `required Foo foo` + `_foo = foo` constructor style used here.
    prefer_initializing_formals: false
    library_private_types_in_public_api: true
    avoid_classes_with_only_static_members: true
