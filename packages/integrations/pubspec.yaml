name: integrations
description: "AI Nutrition Coach adapter package — drift store, OFF/USDA catalog clients, secure-storage wiring. Path-depends on domain_core."
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Ports + entities — adapter implementations live here.
  domain_core:
    path: ../domain_core

  # AD-8 mobile-first encrypted local store.
  drift: 2.34.3

  # At-rest crypto for the drift database: SQLite3MultipleCiphers with the
  # cipher pinned to ChaCha20-Poly1305 (`kPinnedCipher`, AD-8). The
  # `hooks.user_defines.sqlite3.source = sqlite3mc` opt-in that links the
  # multiple-ciphers build lives in the WORKSPACE ROOT `pubspec.yaml`, not
  # here: in a pub workspace the hooks runner reads user-defines only from
  # the workspace root (hooks_runner `UserDefines.workspacePubspec`), so a
  # block in this member is silently ignored and the plain-SQLite build
  # would be linked (security review D3).
  sqlite3: ^3.5.0

  # Keychain/Keystore for the 32-byte DB key alias `ai_nutrition_coach_db_key_v1`.
  flutter_secure_storage: ^11.0.0

  # AD-8 path resolution — drift's `NativeDatabase` needs a file path
  # outside of unit tests (where we use `NativeDatabase.memory()`).
  path_provider: ^2.1.5

  # Story 1.7 — AD-4 network seam for the offline-first
  # `OfflineFirstFoodCatalog.lookupByBarcode` path. Only adapter
  # code in this package pulls from `dio`; the UI never imports
  # the network library (verified by the AD-1 grep test in
  # `apps/client/lib/` and the manual check the spec calls out).
  dio: ^5.11.0

  # Sealed result types (`StoreFailure`, etc.) carry a `meta`-free tag
  # for diagnostics — `meta` lets us add a `@sealed` annotation hint.
  meta: ^1.16.0

  # Story 4.1 — PBKDF2-HMAC-SHA256 for the in-memory web session key
  # (AD-8: the key is held in memory only, derived from a user-supplied
  # passphrase, never persisted). The web rung has no OS keystore; the
  # derived key is the only protection between the user's passphrase
  # and the on-disk schema. Pure-Dart, no JS interop.
  crypto: ^3.0.6

  # D9 — hand a mobile export to the platform share sheet (the file is
  # written to a temp dir and deleted after the hand-off).
  share_plus: ^13.3.1

  # `package:web` — the Blob-download export destination (web only).
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.34.3
  lints: ^5.0.0
  test: ^1.25.6
  melos: 8.2.2
  build_runner: ^2.4.13

dependency_overrides:
  # Drift_dev 2.34.1+ requires analyzer ^13.0.0, which conflicts with the
  # flutter SDK's bundled flutter_test pinning to test_api 0.7.11.
  # This override is removed once the workspace is bumped to Flutter 3.47.
  test_api: ^0.7.13
