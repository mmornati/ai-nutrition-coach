name: _ai_nutrition_coach_workspace
description: "AI Nutrition Coach monorepo root — Dart pub workspace. See melos.yaml for orchestration."
publish_to: 'none'
version: 0.0.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Dart pub workspaces: lists every member package. `melos bootstrap` walks
# the same set via `packages:` in melos.yaml and links path dependencies.
workspace:
  - apps/client
  - packages/domain_core
  - packages/integrations

dev_dependencies:
  melos: 8.2.2

# Melos 8.x reads scripts from this block (see melos.yaml for the
# scaffold-era location; the migration is documented in story 1.2's
# deviation log).
melos:
  scripts:
    analyze:
      description: Run static analysis across every package in the workspace.
      run: melos exec -c 1 --order-dependents -- "if grep -qE '^flutter:|sdk:[[:space:]]+flutter' pubspec.yaml; then flutter analyze; else dart analyze; fi"

    test:
      description: Run unit tests across every package in the workspace.
      # Mirror the analyze split: any package that depends on the Flutter
      # SDK (apps/client, packages/integrations) needs `flutter test` —
      # `dart test` cannot compile `package:flutter`. Pure-Dart packages
      # run `dart test`.
      run: melos exec -c 4 --order-dependents -- "if grep -qE '^flutter:|sdk:[[:space:]]+flutter' pubspec.yaml; then flutter test; else dart test; fi"

    format:check:
      description: Verify every package is `dart format`-clean.
      run: melos exec -c 1 --order-dependents -- "dart format --set-exit-if-changed ."

    build:web:
      description: Build the responsive client as a release web bundle (self-host).
      run: cd apps/client && flutter build web --release --pwa-strategy=none --no-web-resources-cdn --dart-define=AI_NUTRITION_COACH_BUILD=selfhost

    build:runner:
      description: Run drift codegen across the integrations package.
      run: melos exec -c 1 --order-dependents --dir-exists=lib/src/store -- "dart run build_runner build --delete-conflicting-outputs"

    smoke:self-host:
      description: Run the self-host smoke test (Story 4.4 / FR-11).
      run: bash scripts/smoke_self_host.sh

    check:telemetry:
      description: Pin the FR-12 / FR-9 / NFR4 no-telemetry invariant (Story 4.5).
      run: dart run tools/check_telemetry_claims.dart

    check:release-posture:
      description: Assert the LICENSE + CONTRIBUTING + NDP Standard exist (Story 4.6).
      run: dart run tools/check_release_posture.dart && dart run tools/check_adults_only.dart && dart run tools/check_no_under_13_profiles.dart && dart run tools/check_accessibility_floor.dart
